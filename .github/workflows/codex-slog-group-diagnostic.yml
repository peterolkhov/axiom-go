name: Codex slog group BEFORE diagnostic
on:
  push:
    branches: [codex/diagnose-slog-groups]
permissions:
  contents: read
jobs:
  reproduce-before:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: axiomhq/axiom-go
          ref: 49b3101ae7b78c2a334276747e06dbed191c7f6e
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26.0"
          cache: false
      - name: Add bounded public diagnostic fixture only
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          p=Path("codex_diagnostic/diagnostic_group_scope_test.go")
          assert not p.exists()
          p.parent.mkdir()
          p.write_bytes(base64.b64decode(""))
          PY
      - name: Reproduce known scope failures and verify controls
        run: |
          python - <<'PY'
          import subprocess,json,hashlib
          from pathlib import Path
          assert subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()=="49b3101ae7b78c2a334276747e06dbed191c7f6e"
          assert subprocess.check_output(["git","diff","--name-only"],text=True).strip()==""
          p=subprocess.run(["go","test","-mod=readonly","./codex_diagnostic","-run","^TestDiagnosticGroupScopes$","-count=1","-v","-json","-timeout","60s"],capture_output=True,text=True)
          print(p.stdout,flush=True);print(p.stderr,flush=True)
          observations=[]
          for line in p.stdout.splitlines():
           try:event=json.loads(line)
           except json.JSONDecodeError:continue
           output=event.get("Output","")
           if "OBSERVATION_JSON=" in output:
            observations.append(json.loads(output.split("OBSERVATION_JSON=",1)[1]))
          report=dict(purpose="BEFORE diagnostic: exit zero confirms known defects, NOT product passing",source_head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),go_version=subprocess.check_output(["go","version"],text=True).strip(),go_test_exit=p.returncode,observations=observations)
          print("DIAGNOSTIC_JSON="+json.dumps(report,sort_keys=True),flush=True)
          assert p.returncode==1 and len(observations)==4
          assert [o["index"] for o in observations]==list(range(4))
          assert [o["product_contract_met"] for o in observations]==[False,False,True,True]
          PY
